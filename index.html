<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Liminal — Labirinto</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: #000; color: #ddd; text-align: center; padding: 20px;
  }
  #overlay h1 { font-size: 36px; font-weight: 200; letter-spacing: 14px; margin: 0 0 8px; color: #fff; text-transform: uppercase; }
  #overlay p { opacity: .55; margin: 0 0 28px; font-size: 12px; letter-spacing: 3px; }
  .menu-btn {
    background: transparent; border: 1px solid #444; color: #ccc;
    padding: 12px 32px; font-size: 13px; letter-spacing: 3px; cursor: pointer;
    text-transform: uppercase; transition: all .2s;
  }
  .menu-btn:hover { background: #fff; color: #000; border-color: #fff; }

  #hud {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 8; color: #fff; font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
    opacity: 0; transition: opacity 1.5s; pointer-events: none; text-align: center;
  }
  #hud.visible { opacity: .6; }
  #dist { font-family: monospace; letter-spacing: 2px; font-size: 10px; color: #888; margin-top: 6px; }

  #danger {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(120,0,0,.85) 100%);
    transition: opacity .15s;
  }
  #flash {
    position: fixed; inset: 0; z-index: 20; pointer-events: none; background: #000;
    opacity: 0; transition: opacity .8s;
  }
  #flash.show { opacity: 1; transition: opacity .05s; }

  #joystick {
    position: fixed; z-index: 14; width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.15);
    pointer-events: none; display: none;
  }
  #joystickKnob {
    position: absolute; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.45);
    top: 50%; left: 50%; margin-left: -31px; margin-top: -31px;
  }
  #btnSprint {
    position: fixed; bottom: 22px; right: 22px; z-index: 15;
    width: 82px; height: 82px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.3);
    color: #fff; font-size: 30px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; transition: background .15s;
  }
  #btnSprint.active { background: rgba(255,255,255,.5); color: #000; }
  @media (hover: none) { #btnSprint { display: flex; } }
</style>
</head>
<body>

<div id="flash"></div>
<div id="danger"></div>

<div id="overlay">
  <h1>Liminal</h1>
  <p>Corredores que não terminam.</p>
  <button class="menu-btn" id="btnStart">Entrar</button>
  <p style="margin-top:24px; font-size:10px; opacity:.35; letter-spacing:2px;">WASD / setas · Shift para correr</p>
</div>

<div id="hud">
  <div>Nível 1 — Labirinto</div>
  <div id="dist">—</div>
</div>

<div id="joystick"><div id="joystickKnob"></div></div>
<button id="btnSprint">🏃</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ============================================================
//  CONFIG DO LABIRINTO
// ============================================================
const CELLS   = 21;              // ímpar! gera labirinto perfeito
const CELL    = 4.2;             // tamanho de cada célula em unidades
const WALL_H  = 3.4;             // altura da parede
const WALL_T  = 0.28;            // espessura
const PLAYER_R = 0.35;
const EYE_H   = 1.65;
const BASE_SPEED = 4.2;
const SPRINT_MULT = 1.85;
const CREATURE_SPEED = 2.35;     // um pouco mais lento que correr, mais rápido que andar
const CREATURE_AGGRO = 1;        // persegue sempre

// ============================================================
//  RENDERER / CENA
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.055);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
//  ILUMINAÇÃO — preto e branco, baixa
// ============================================================
scene.add(new THREE.AmbientLight(0xffffff, 0.06));

const flashlight = new THREE.SpotLight(0xffffff, 22, 26, Math.PI/6.5, 0.45, 1.2);
flashlight.castShadow = true;
flashlight.shadow.mapSize.set(1024, 1024);
flashlight.shadow.camera.near = 0.5;
flashlight.shadow.camera.far = 30;
flashlight.shadow.bias = -0.001;
scene.add(flashlight);
scene.add(flashlight.target);

// luz fria de preenchimento no topo (identidade liminal)
const topLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.12);
scene.add(topLight);

// ============================================================
//  TEXTURA DE PAREDE (ruído monocromático)
// ============================================================
function makeNoiseTexture(size, base) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `rgb(${base},${base},${base})`;
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 40;
    img.data[i]   = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 1.2);
  return t;
}
const wallTex = makeNoiseTexture(256, 210);
const floorTex = makeNoiseTexture(256, 40);
floorTex.repeat.set(CELLS * 0.5, CELLS * 0.5);

// ============================================================
//  CHÃO
// ============================================================
const worldSize = CELLS * CELL;
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(worldSize, worldSize),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 1, color: 0xffffff })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// teto (importante pro clima liminal fechado)
const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(worldSize, worldSize),
  new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1, side: THREE.BackSide })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = WALL_H;
scene.add(ceiling);

// ============================================================
//  GERAÇÃO DO LABIRINTO (DFS recursivo com stack)
// ============================================================
// grid[y][x] = true => parede
let grid = [];

function generateMaze(size) {
  const g = [];
  for (let y = 0; y < size; y++) {
    g[y] = [];
    for (let x = 0; x < size; x++) g[y][x] = true;
  }

  const stack = [];
  const startX = 1, startY = 1;
  g[startY][startX] = false;
  stack.push([startX, startY]);

  const dirs = [[0,-2],[2,0],[0,2],[-2,0]];

  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const neighbors = [];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx > 0 && ny > 0 && nx < size-1 && ny < size-1 && g[ny][nx]) {
        neighbors.push([nx, ny, cx + dx/2, cy + dy/2]);
      }
    }
    if (neighbors.length === 0) {
      stack.pop();
      continue;
    }
    const [nx, ny, wx, wy] = neighbors[Math.floor(Math.random() * neighbors.length)];
    g[wy][wx] = false;
    g[ny][nx] = false;
    stack.push([nx, ny]);
  }

  // abre algumas paredes extras para criar "loops" (mais liminal, menos claustrofóbico)
  let extra = Math.floor(size * size * 0.04);
  while (extra > 0) {
    const x = 1 + Math.floor(Math.random() * (size - 2));
    const y = 1 + Math.floor(Math.random() * (size - 2));
    if (g[y][x] && ((g[y][x-1] === false && g[y][x+1] === false) || (g[y-1][x] === false && g[y+1][x] === false))) {
      g[y][x] = false;
      extra--;
    }
  }

  return g;
}

grid = generateMaze(CELLS);

// ============================================================
//  INSTANCED WALLS
// ============================================================
let wallMesh = null;

function buildWalls() {
  if (wallMesh) {
    scene.remove(wallMesh);
    wallMesh.geometry.dispose();
    wallMesh.material.dispose();
  }

  let count = 0;
  for (let y = 0; y < CELLS; y++)
    for (let x = 0; x < CELLS; x++)
      if (grid[y][x]) count++;

  const geo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const mat = new THREE.MeshStandardMaterial({ map: wallTex, color: 0xffffff, roughness: 0.95 });
  wallMesh = new THREE.InstancedMesh(geo, mat, count);
  wallMesh.castShadow = true;
  wallMesh.receiveShadow = true;

  const dummy = new THREE.Object3D();
  const offset = -worldSize / 2 + CELL / 2;
  let i = 0;
  for (let y = 0; y < CELLS; y++) {
    for (let x = 0; x < CELLS; x++) {
      if (!grid[y][x]) continue;
      dummy.position.set(offset + x * CELL, WALL_H / 2, offset + y * CELL);
      dummy.updateMatrix();
      wallMesh.setMatrixAt(i++, dummy.matrix);
    }
  }
  wallMesh.instanceMatrix.needsUpdate = true;
  scene.add(wallMesh);
}

buildWalls();

// ============================================================
//  COLISÃO — AABB por célula
// ============================================================
const offset = -worldSize / 2 + CELL / 2;

function isWallCell(cx, cz) {
  if (cx < 0 || cz < 0 || cx >= CELLS || cz >= CELLS) return true;
  return grid[cz][cx];
}

function worldToCell(wx, wz) {
  return [Math.round((wx - offset) / CELL), Math.round((wz - offset) / CELL)];
}

// resolve colisão empurrando o jogador pra fora do bloco
function resolveCollision(pos) {
  const [cx, cz] = worldToCell(pos.x, pos.z);
  // testa as células ao redor
  for (let dz = -1; dz <= 1; dz++) {
    for (let dx = -1; dx <= 1; dx++) {
      const gx = cx + dx, gz = cz + dz;
      if (!isWallCell(gx, gz)) continue;
      const wx = offset + gx * CELL;
      const wz = offset + gz * CELL;
      const half = CELL / 2 + PLAYER_R;
      const ddx = pos.x - wx;
      const ddz = pos.z - wz;
      if (Math.abs(ddx) < half && Math.abs(ddz) < half) {
        // empurra no eixo de menor penetração
        const penX = half - Math.abs(ddx);
        const penZ = half - Math.abs(ddz);
        if (penX < penZ) pos.x += Math.sign(ddx || 1) * penX;
        else             pos.z += Math.sign(ddz || 1) * penZ;
      }
    }
  }
}

// ============================================================
//  A* PARA A CRIATURA
// ============================================================
function findPath(startCell, goalCell) {
  const [sx, sz] = startCell;
  const [gx, gz] = goalCell;
  if (sx === gx && sz === gz) return [];

  const key = (x, z) => z * CELLS + x;
  const open = [{ x: sx, z: sz, g: 0, f: 0, parent: null }];
  const openMap = new Map();
  const closed = new Set();
  openMap.set(key(sx, sz), open[0]);

  const h = (x, z) => Math.abs(x - gx) + Math.abs(z - gz);

  while (open.length) {
    // pega menor f (busca linear — ok pra grid 21x21)
    let bestIdx = 0;
    for (let i = 1; i < open.length; i++) if (open[i].f < open[bestIdx].f) bestIdx = i;
    const current = open.splice(bestIdx, 1)[0];
    openMap.delete(key(current.x, current.z));

    if (current.x === gx && current.z === gz) {
      const path = [];
      let n = current;
      while (n && n.parent) { path.push([n.x, n.z]); n = n.parent; }
      return path.reverse();
    }

    closed.add(key(current.x, current.z));

    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx, dz] of dirs) {
      const nx = current.x + dx, nz = current.z + dz;
      if (isWallCell(nx, nz)) continue;
      const k = key(nx, nz);
      if (closed.has(k)) continue;
      const g = current.g + 1;
      const existing = openMap.get(k);
      if (existing && g >= existing.g) continue;
      const node = { x: nx, z: nz, g, f: g + h(nx, nz), parent: current };
      if (existing) {
        existing.g = g; existing.f = node.f; existing.parent = current;
      } else {
        open.push(node);
        openMap.set(k, node);
      }
    }
  }
  return [];
}

// ============================================================
//  CRIATURA
// ============================================================
const creature = new THREE.Group();
// corpo — silhueta alta e fina
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 1.6, 4, 8), bodyMat);
body.position.y = 1.1;
body.castShadow = true;
creature.add(body);
// cabeça
const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), bodyMat);
head.position.y = 2.15;
head.castShadow = true;
creature.add(head);
// olhos (brilham)
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), eyeMat);
eyeL.position.set(-0.09, 2.18, -0.22);
const eyeR = eyeL.clone(); eyeR.position.x = 0.09;
creature.add(eyeL, eyeR);
// braços longos
const armGeo = new THREE.CapsuleGeometry(0.06, 1.1, 3, 6);
const armL = new THREE.Mesh(armGeo, bodyMat);
armL.position.set(-0.42, 1.15, 0); armL.rotation.z = 0.15;
const armR = new THREE.Mesh(armGeo, bodyMat);
armR.position.set(0.42, 1.15, 0); armR.rotation.z = -0.15;
creature.add(armL, armR);

scene.add(creature);

// ponto de spawn: célula aberta distante do jogador
const playerStart = new THREE.Vector3(offset + CELL, EYE_H, offset + CELL);
const player = playerStart.clone();

function findFarCell() {
  let best = null, bestD = -1;
  for (let y = 1; y < CELLS - 1; y++) {
    for (let x = 1; x < CELLS - 1; x++) {
      if (grid[y][x]) continue;
      const wx = offset + x * CELL, wz = offset + y * CELL;
      const d = (wx - player.x) ** 2 + (wz - player.z) ** 2;
      if (d > bestD) { bestD = d; best = [x, y]; }
    }
  }
  return best;
}

let creaturePos = new THREE.Vector3();
let creatureCell = null;
let path = [];
let pathTimer = 0;
let creatureActive = false;

function respawnCreature() {
  const cell = findFarCell();
  creatureCell = cell;
  creaturePos.set(offset + cell[0] * CELL, 0, offset + cell[1] * CELL);
  creature.position.copy(creaturePos);
  creature.visible = true;
  path = [];
}

respawnCreature();
creature.visible = false;

// ============================================================
//  ÁUDIO — Web Audio API, sem arquivos
// ============================================================
let audioCtx = null;
let creatureOsc = null, creatureGain = null, creatureFilter = null;
let noiseSource = null, noiseGain = null, noiseFilter = null;
let heartbeatTimer = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // ---- RONCO DA CRIATURA (oscilador grave + LFO) ----
  creatureOsc = audioCtx.createOscillator();
  creatureOsc.type = 'sawtooth';
  creatureOsc.frequency.value = 42;

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.7;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 8;
  lfo.connect(lfoGain).connect(creatureOsc.frequency);
  lfo.start();

  creatureFilter = audioCtx.createBiquadFilter();
  creatureFilter.type = 'lowpass';
  creatureFilter.frequency.value = 220;
  creatureFilter.Q.value = 4;

  creatureGain = audioCtx.createGain();
  creatureGain.gain.value = 0;

  creatureOsc.connect(creatureFilter).connect(creatureGain).connect(audioCtx.destination);
  creatureOsc.start();

  // ---- RUÍDO AMBIENTE (chiado de corredor) ----
  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  noiseSource.loop = true;

  noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 900;
  noiseFilter.Q.value = 0.6;

  noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.008;

  noiseSource.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
  noiseSource.start();
}

function playHeartbeat(volume) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 0.16].forEach((offset, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(60, t + offset);
    osc.frequency.exponentialRampToValueAtTime(30, t + offset + 0.18);
    g.gain.setValueAtTime(0, t + offset);
    g.gain.linearRampToValueAtTime(volume, t + offset + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.25);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t + offset);
    osc.stop(t + offset + 0.3);
  });
}

function playScream() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(800, t);
  osc.frequency.exponentialRampToValueAtTime(120, t + 0.9);
  filter.type = 'bandpass';
  filter.frequency.value = 600;
  filter.Q.value = 2;
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  osc.connect(filter).connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 1.0);
}

// ============================================================
//  INPUT
// ============================================================
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup',   e => { keys[e.code] = false; });

// joystick touch
const joyEl = document.getElementById('joystick');
const knobEl = document.getElementById('joystickKnob');
let joyActive = false, joyId = null, joyStart = { x:0, y:0 }, joyVec = { x:0, y:0 };
let sprintTouch = false;

function setupTouchControls() {
  if (!isTouch) return;
  const btnSprint = document.getElementById('btnSprint');
  btnSprint.addEventListener('touchstart', e => { e.preventDefault(); sprintTouch = true; btnSprint.classList.add('active'); });
  btnSprint.addEventListener('touchend',   e => { e.preventDefault(); sprintTouch = false; btnSprint.classList.remove('active'); });

  canvas.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth * 0.5) {
        joyActive = true; joyId = t.identifier;
        joyStart.x = t.clientX; joyStart.y = t.clientY;
        joyEl.style.display = 'block';
        joyEl.style.left = (t.clientX - 70) + 'px';
        joyEl.style.top  = (t.clientY - 70) + 'px';
        knobEl.style.transform = 'translate(0,0)';
        break;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) {
        const dx = t.clientX - joyStart.x;
        const dy = t.clientY - joyStart.y;
        const max = 55;
        const len = Math.hypot(dx, dy);
        const cl = Math.min(len, max);
        const nx = len ? dx / len : 0;
        const ny = len ? dy / len : 0;
        joyVec.x = nx * (cl / max);
        joyVec.y = ny * (cl / max);
        knobEl.style.transform = `translate(${nx*cl}px, ${ny*cl}px)`;
        break;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) {
        joyActive = false; joyId = null; joyVec.x = 0; joyVec.y = 0;
        joyEl.style.display = 'none';
        break;
      }
    }
  }, { passive: false });
}
setupTouchControls();

// ============================================================
//  LOOP
// ============================================================
let gameActive = false;
let lastT = performance.now();
let bobPhase = 0;
let yaw = 0;

const hud = document.getElementById('hud');
const distEl = document.getElementById('dist');
const dangerEl = document.getElementById('danger');
const flashEl = document.getElementById('flash');

document.getElementById('btnStart').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  hud.classList.add('visible');
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  gameActive = true;
  creature.visible = true;
});

// captura do mouse no desktop (olhar com mouse)
let pointerLocked = false;
canvas.addEventListener('click', () => {
  if (!isTouch && gameActive && !pointerLocked) {
    canvas.requestPointerLock?.();
  }
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if (pointerLocked) yaw -= e.movementX * 0.0022;
});

// ============================================================
//  UPDATE LOOP
// ============================================================
function update(dt) {
  // --- input direção ---
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

  if (joyActive) { mx += joyVec.x; mz += joyVec.y; }

  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }

  const sprinting = keys['ShiftLeft'] || keys['ShiftRight'] || sprintTouch;
  const speed = BASE_SPEED * (sprinting ? SPRINT_MULT : 1);

  // direção relativa ao yaw
  const fwdX = Math.sin(yaw), fwdZ = Math.cos(yaw);
  const rightX = Math.cos(yaw), rightZ = -Math.sin(yaw);

  // no labirinto, fwd negativo = -Z
  const dx = (mx * rightX + (-mz) * fwdX) * speed * dt;
  const dz = (mx * rightZ + (-mz) * fwdZ) * speed * dt;

  player.x += dx;
  player.z += dz;
  resolveCollision(player);

  // camera
  const moving = len > 0.1;
  if (moving) bobPhase += dt * (sprinting ? 14 : 9);
  const bob = Math.sin(bobPhase) * (sprinting ? 0.06 : 0.035);
  camera.position.set(player.x, EYE_H + bob, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = 0;

  // flashlight segue a câmera
  flashlight.position.copy(camera.position);
  flashlight.target.position.set(
    camera.position.x + Math.sin(yaw) * -1,
    camera.position.y - 0.15,
    camera.position.z + Math.cos(yaw) * -1
  );
  flashlight.target.updateMatrixWorld();

  // --- CRIATURA ---
  if (creatureActive) updateCreature(dt);
}

function updateCreature(dt) {
  pathTimer -= dt;

  const playerCell = worldToCell(player.x, player.z);

  // recalcula caminho periodicamente
  if (pathTimer <= 0) {
    const cc = worldToCell(creaturePos.x, creaturePos.z);
    path = findPath(cc, playerCell);
    pathTimer = 0.35;
  }

  // move pela próxima célula do path
  if (path.length > 0) {
    const [nx, nz] = path[0];
    const tx = offset + nx * CELL;
    const tz = offset + nz * CELL;
    const dx = tx - creaturePos.x;
    const dz = tz - creaturePos.z;
    const d = Math.hypot(dx, dz);

    if (d < 0.15) {
      path.shift();
    } else {
      const vx = (dx / d) * CREATURE_SPEED * dt;
      const vz = (dz / d) * CREATURE_SPEED * dt;
      creaturePos.x += vx;
      creaturePos.z += vz;
    }
  }

  creature.position.copy(creaturePos);

  // orienta a criatura para o jogador
  const lookX = player.x - creaturePos.x;
  const lookZ = player.z - creaturePos.z;
  creature.rotation.y = Math.atan2(lookX, lookZ);

  // --- áudio posicional da criatura ---
  const dist = Math.hypot(lookX, lookZ);

  // ganho do ronco: mais perto = mais alto
  const maxDist = 40;
  const prox = Math.max(0, 1 - dist / maxDist);
  if (creatureGain) {
    const targetGain = 0.03 + prox * prox * 0.5;
    creatureGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.15);
    creatureFilter.frequency.setTargetAtTime(
      180 + prox * 600,
      audioCtx.currentTime, 0.2
    );
  }

  // heartbeat quando perto
  if (dist < 12) {
    heartbeatTimer -= dt;
    if (heartbeatTimer <= 0) {
      playHeartbeat(0.08 + (1 - dist / 12) * 0.2);
      heartbeatTimer = 0.35 + (dist / 12) * 0.6;
    }
  }

  // tela vermelha
  dangerEl.style.opacity = dist < 8 ? (1 - dist / 8) * 0.55 : 0;

  // fim de jogo
  if (dist < 1.1) {
    gameActive = false;
    creatureActive = false;
    flashEl.classList.add('show');
    playScream();
    if (creatureGain) creatureGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    setTimeout(() => {
      flashEl.classList.remove('show');
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('overlay').innerHTML = `
        <h1 style="letter-spacing:20px">Fim</h1>
        <p style="margin-bottom:28px">Você foi encontrado.</p>
        <button class="menu-btn" id="btnRestart">Tentar de novo</button>
      `;
      document.getElementById('btnRestart').addEventListener('click', restart);
      hud.classList.remove('visible');
      dangerEl.style.opacity = 0;
    }, 400);
  }

  distEl.textContent = dist < 12 ? `⚠ ${dist.toFixed(1)}m` : '';
}

function restart() {
  // regenera labirinto
  grid = generateMaze(CELLS);
  buildWalls();

  // reseta jogador
  player.set(offset + CELL, EYE_H, offset + CELL);
  yaw = 0;

  // reposiciona criatura longe
  respawnCreature();
  creatureActive = true;

  document.getElementById('overlay').style.display = 'none';
  hud.classList.add('visible');
  gameActive = true;
  dangerEl.style.opacity = 0;
}

// inicia a criatura quando o jogo começa (mesma célula do botão Start)
const _origStart = document.getElementById('btnStart').onclick;
document.getElementById('btnStart').addEventListener('click', () => {
  setTimeout(() => { creatureActive = true; }, 500);
});

let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameActive) update(dt);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
