<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Liminal</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #000; touch-action: none;
    overscroll-behavior: none; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  input { user-select: text; -webkit-user-select: text; }

  #static { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0;
    mix-blend-mode: screen; background-size: 512px 512px; transition: opacity .2s; }
  #blood { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
    background:
      radial-gradient(circle at 8% 15%, rgba(100,0,0,.75), transparent 22%),
      radial-gradient(circle at 92% 25%, rgba(100,0,0,.65), transparent 18%),
      radial-gradient(circle at 15% 85%, rgba(100,0,0,.55), transparent 20%),
      radial-gradient(circle at 85% 88%, rgba(100,0,0,.7), transparent 25%),
      radial-gradient(circle at 50% 5%, rgba(100,0,0,.35), transparent 15%);
    transition: opacity .3s; }
  #face { position: fixed; inset: 0; z-index: 11; pointer-events: none; opacity: 0;
    display: none; align-items: center; justify-content: center; transition: opacity .08s; }
  #face canvas { width: min(90vw, 90vh); height: min(90vw, 90vh);
    filter: contrast(1.4) saturate(0.2) drop-shadow(0 0 40px #500); }

  #jumpscare { position: fixed; inset: 0; z-index: 30; background: #000; display: none; opacity: 0;
    pointer-events: none; align-items: center; justify-content: center; overflow: hidden; }
  #jumpscare.show { display: flex; opacity: 1; }
  #jumpscare canvas { width: min(130vw, 130vh); height: min(130vw, 130vh);
    filter: contrast(1.5) saturate(.3) drop-shadow(0 0 60px #800); }
  #jumpscare.show canvas { animation: scare .45s steps(2, end) both, shake .06s infinite; }
  @keyframes scare { from { transform: scale(.55); } to { transform: scale(1.35); } }
  @keyframes shake { 0% { margin: 0 0 0 0; } 25% { margin: 6px 0 0 -8px; } 50% { margin: -7px 0 0 7px; } 75% { margin: 5px 0 0 6px; } 100% { margin: -4px 0 0 -5px; } }

  #flash { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: #fff;
    opacity: 0; transition: opacity .4s; }
  #flash.show { opacity: 1; transition: opacity .03s; }
  #flash.win { background: #e8eeff; }

  #danger { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(120,0,0,.9) 100%); }

  #vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0px, rgba(0,0,0,.10) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.9) 100%); }

  #hunterOverlay { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(80,0,0,.15) 0%, rgba(60,0,0,.6) 100%);
    transition: opacity .5s; }
  #hunterOverlay.active { opacity: 1; }

  #hud { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 8;
    color: #eee; font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
    opacity: 0; transition: opacity 1.5s; pointer-events: none; text-align: center; }
  #hud.visible { opacity: .7; }
  #dist { font-family: monospace; letter-spacing: 2px; font-size: 10px; color: #d33; margin-top: 6px; height: 14px; }
  #goalHint { font-family: monospace; letter-spacing: 2px; font-size: 9px; color: #aac; margin-top: 4px; height: 12px; }
  #staminaBar { width: 140px; height: 3px; background: rgba(255,255,255,.1); margin: 10px auto 0; border-radius: 2px; overflow: hidden; }
  #staminaFill { height: 100%; width: 100%; background: rgba(255,255,255,.5); transition: width .1s; }

  #menu { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center;
    background: #000; color: #ccc; text-align: center; padding: 20px; flex-direction: column;
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .menu-page { display: none; flex-direction: column; align-items: center; gap: 12px; max-width: 320px; width: 100%; margin: auto 0; }
  .menu-page h1 { font-size: 34px; font-weight: 200; letter-spacing: 16px; margin: 0 0 4px; color: #fff; text-transform: uppercase; }
  .menu-page h2 { font-size: 18px; font-weight: 200; letter-spacing: 8px; margin: 0 0 8px; color: #fff; text-transform: uppercase; }
  .menu-page p { opacity: .5; margin: 0 0 16px; font-size: 11px; letter-spacing: 2px; }
  .mb { background: transparent; border: 1px solid #444; color: #ccc; padding: 13px 26px;
    font-size: 12px; letter-spacing: 3px; cursor: pointer; text-transform: uppercase; transition: all .2s; width: 100%; }
  .mb:hover, .mb:active { background: #fff; color: #000; border-color: #fff; }
  .mb.small { padding: 10px 20px; font-size: 10px; opacity: .7; }
  .small { font-size: 10px; opacity: .4; letter-spacing: 2px; }
  .code { font-size: 34px; letter-spacing: 10px; color: #fff; font-family: monospace; font-weight: bold; margin: 8px 0; }
  .lobby-list { width: 100%; padding: 10px; border: 1px solid #222; margin: 10px 0; min-height: 60px; font-size: 12px; letter-spacing: 2px; box-sizing: border-box; }
  .lobby-list div { padding: 4px 0; color: #aaa; }
  .row { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 12px; letter-spacing: 2px; color: #888; }
  .row select { background: #000; color: #fff; border: 1px solid #333; padding: 8px 10px; font-size: 12px; letter-spacing: 2px; outline: none; }
  #joinCode { background: #000; border: 1px solid #444; color: #fff; padding: 12px; font-size: 22px;
    text-align: center; width: 100%; text-transform: uppercase; letter-spacing: 10px; outline: none; font-family: monospace; box-sizing: border-box; }
  #joinCode:focus { border-color: #fff; }
  .err { color: #f55; font-size: 11px; min-height: 14px; letter-spacing: 1px; }

  #joystick { position: fixed; z-index: 14; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.15);
    pointer-events: none; display: none; }
  #joystickKnob { position: absolute; width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.45);
    top: 50%; left: 50%; margin-left: -29px; margin-top: -29px; }
  #btnSprint { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom)); right: calc(22px + env(safe-area-inset-right)); z-index: 15; width: 78px; height: 78px;
    border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.3);
    color: #fff; font-size: 28px; cursor: pointer; display: none;
    align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #btnSprint.active { background: rgba(255,255,255,.5); color: #000; }
  #touchHint { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 8;
    color: #fff; opacity: 0; font-size: 10px; letter-spacing: 2px; pointer-events: none; transition: opacity 1s; text-align: center; }
  @media (hover: none) { #btnSprint.ingame { display: flex; } }
</style>
</head>
<body>

<div id="static"></div>
<div id="blood"></div>
<div id="face"></div>
<div id="jumpscare"><canvas id="jsFace" width="512" height="512"></canvas></div>
<div id="flash"></div>
<div id="danger"></div>
<div id="hunterOverlay"></div>
<div id="vignette"></div>

<div id="hud">
  <div id="hudTitle">Labirinto</div>
  <div id="dist">—</div>
  <div id="goalHint">Encontre o centro.</div>
  <div id="staminaBar"><div id="staminaFill"></div></div>
</div>
<div id="touchHint">ESQUERDA: ANDAR · DIREITA: OLHAR</div>

<div id="joystick"><div id="joystickKnob"></div></div>
<button id="btnSprint">🏃</button>

<div id="menu">
  <div class="menu-page" id="page-main" style="display:flex">
    <h1>Liminal</h1>
    <p>Corredores que não terminam.</p>
    <button class="mb" id="btnSolo">Jogar Sozinho</button>
    <button class="mb" id="btnHost">Criar Sala</button>
    <button class="mb" id="btnJoin">Entrar em Sala</button>
    <div class="err" id="mainErr"></div>
    <div class="small" style="margin-top:6px">PC: WASD · Shift · Q/E · clique p/ mouse-look<br>Celular: esquerda anda · direita olha</div>
  </div>
  <div class="menu-page" id="page-host">
    <h2>Sala</h2>
    <div class="small">Compartilhe o código</div>
    <div class="code" id="roomCode">------</div>
    <div class="lobby-list" id="hostLobby"><div>Você (P1)</div></div>
    <div class="row">Modo<select id="hostMode"><option value="flee">Todos Fogem</option><option value="hunter">Um é o Monstro</option></select></div>
    <div class="row">Máx<select id="hostMax"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select></div>
    <div class="err" id="hostErr"></div>
    <button class="mb" id="btnStartRoom">Começar</button>
    <button class="mb small" id="btnBackHost">Cancelar</button>
  </div>
  <div class="menu-page" id="page-join">
    <h2>Entrar</h2>
    <div class="small">Código da sala</div>
    <input id="joinCode" maxlength="6" placeholder="XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="mb" id="btnJoinGo">Conectar</button>
    <div class="err" id="joinErr"></div>
    <button class="mb small" id="btnBackJoin">Voltar</button>
  </div>
  <div class="menu-page" id="page-wait">
    <h2>Aguardando</h2>
    <div class="small" id="waitInfo">Conectado</div>
    <div class="lobby-list" id="clientLobby"></div>
    <button class="mb small" id="btnLeaveWait">Sair</button>
  </div>
  <div class="menu-page" id="page-over">
    <h1 id="overTitle">Fim</h1>
    <p id="overMsg"></p>
    <button class="mb" id="btnRestart">Jogar de Novo</button>
    <div class="small" id="overWait"></div>
    <button class="mb small" id="btnQuit">Sair</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
import * as THREE from 'three';

/* ================= CONFIG ================= */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const CELLS = 21, CELL = 4.2, WALL_H = 3.4;
const PLAYER_R = 0.35, EYE_H = 1.65, CREATURE_EYE_H = 2.15;
const BASE_SPEED = 4.2, SPRINT_MULT = 1.85;
const AI_SPEED = 4.0, CREATURE_PLAYER_SPEED = 4.4;
const CATCH_DIST = 2.8, NET_HZ = 15, NET_TIMEOUT = 8000;
const GOAL_RADIUS = 1.5;
const STAMINA_MAX = 100, STAMINA_DRAIN = 24, STAMINA_REGEN = 15, STAMINA_MIN = 22;
const PLAYER_COLORS = [0x4a9eff, 0xff4a4a, 0x4aff4a, 0xffea4a];
const ID_PREFIX = 'lmnl-';
const DIRS4 = [[1,0],[-1,0],[0,1],[0,-1]];
const PEER_OPTS = {
  debug: 0,
  config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ] }
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angNorm = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const faceAngle = (dx, dz) => Math.atan2(-dx, -dz);          // yaw que faz o -Z do modelo apontar para (dx,dz)
const lerpAngle = (a, b, t) => a + angNorm(b - a) * t;
const vib = p => { if (isTouch && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } };

let rng = Math.random;
function setSeed(s) {
  let a = s >>> 0;
  rng = () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================= RENDERER / CENA ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030202, 0.062);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isTouch ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;
canvas.addEventListener('contextmenu', e => e.preventDefault());

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 200));

scene.add(new THREE.AmbientLight(0xffffff, 0.05));
const flashlight = new THREE.SpotLight(0xffffff, 22, 26, Math.PI/6.5, 0.45, 1.2);
flashlight.castShadow = true;
flashlight.shadow.mapSize.set(isTouch ? 512 : 1024, isTouch ? 512 : 1024);
flashlight.shadow.camera.near = 0.5; flashlight.shadow.camera.far = 30;
flashlight.shadow.bias = -0.001;
scene.add(flashlight, flashlight.target);
scene.add(new THREE.HemisphereLight(0x8a8060, 0x000000, 0.12));

// Pool fixo de luzes de teto (quantidade constante para não recompilar shaders)
const lampLights = [];
for (let i = 0; i < (isTouch ? 2 : 3); i++) {
  const l = new THREE.PointLight(0xc4d49a, 0, 11, 2);
  scene.add(l); lampLights.push(l);
}

/* ================= TEXTURAS ================= */
function noiseTex(size, base) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `rgb(${base},${base},${base})`; ctx.fillRect(0,0,size,size);
  const img = ctx.getImageData(0,0,size,size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 42;
    img.data[i]   = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 1.2);
  return t;
}

function paintEyes(ctx, x, y, sc) {
  for (const sx of [-1, 1]) {
    const ex = x + sx * 26 * sc;
    ctx.fillStyle = 'rgba(20,10,8,.85)'; ctx.beginPath(); ctx.ellipse(ex, y, 20*sc, 11*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(205,198,180,.85)'; ctx.beginPath(); ctx.ellipse(ex, y, 15*sc, 8*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(130,0,0,.95)'; ctx.beginPath(); ctx.arc(ex, y, 5.5*sc, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex, y, 2.4*sc, 0, Math.PI*2); ctx.fill();
  }
}

function makeScaryWallTex(variant) {
  const size = isTouch ? 512 : 1024, k = size / 1024, s = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#79746a';
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 55;
    img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
  ctx.scale(k, k);

  // papel de parede desbotado (estilo backrooms)
  for (let x = 0; x < s; x += 64) { ctx.fillStyle = 'rgba(0,0,0,.09)'; ctx.fillRect(x, 0, 3, s); }

  // mofo / manchas
  for (let i = 0; i < 36; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const r = 40 + Math.random() * 200;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(18,12,8,${0.2 + Math.random() * 0.35})`);
    grad.addColorStop(1, 'rgba(18,12,8,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // sangue escorrendo
  const drips = variant === 2 ? 12 : 8;
  for (let i = 0; i < drips; i++) {
    const x = Math.random() * s;
    const w = 3 + Math.random() * 12;
    const h = 80 + Math.random() * 450;
    ctx.fillStyle = `rgba(${50 + Math.random()*40|0}, 0, 0, ${0.55 + Math.random()*0.35})`;
    ctx.fillRect(x, 0, w, h);
    ctx.beginPath(); ctx.arc(x + w/2, h, w/2 + 4, 0, Math.PI * 2); ctx.fill();
    if (Math.random() > 0.5) {
      const h2 = h * (0.3 + Math.random() * 0.5);
      const w2 = 1 + Math.random() * 4;
      const x2 = x + w + 4 + Math.random() * 20;
      ctx.fillStyle = `rgba(${45 + Math.random()*30|0}, 0, 0, ${0.4 + Math.random()*0.3})`;
      ctx.fillRect(x2, 0, w2, h2);
    }
  }

  // respingos
  for (let i = 0; i < 6; i++) {
    const cx = Math.random() * s, cy = Math.random() * s;
    const mainR = 12 + Math.random() * 30;
    ctx.fillStyle = `rgba(${50 + Math.random()*40|0}, 0, 0, ${0.6 + Math.random()*0.3})`;
    ctx.beginPath(); ctx.arc(cx, cy, mainR, 0, Math.PI * 2); ctx.fill();
    for (let j = 0; j < 40; j++) {
      const a = Math.random() * Math.PI * 2;
      const d = mainR + Math.random() * 100;
      const r = 1 + Math.random() * 6;
      ctx.fillStyle = `rgba(${40 + Math.random()*40|0}, 0, 0, ${0.4 + Math.random()*0.5})`;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // marcas de garras
  for (let i = 0; i < 6; i++) {
    const cx = Math.random() * s, cy = Math.random() * s;
    const angle = Math.random() * Math.PI * 2;
    const len = 120 + Math.random() * 280;
    const count = 3 + Math.floor(Math.random() * 3);
    const gap = 10 + Math.random() * 14;
    for (let sp = 0; sp < count; sp++) {
      const off = (sp - (count-1)/2) * gap;
      const startX = cx + Math.cos(angle + Math.PI/2) * off;
      const startY = cy + Math.sin(angle + Math.PI/2) * off;
      ctx.strokeStyle = `rgba(${22 + Math.random()*15|0}, 12, 8, ${0.7 + Math.random()*0.25})`;
      ctx.lineWidth = 2 + Math.random() * 3;
      ctx.lineCap = 'round';
      const endX = startX + Math.cos(angle) * len;
      const endY = startY + Math.sin(angle) * len;
      const cpX = (startX + endX) / 2 + Math.cos(angle + Math.PI/2) * (Math.random() - 0.5) * 30;
      const cpY = (startY + endY) / 2 + Math.sin(angle + Math.PI/2) * (Math.random() - 0.5) * 30;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(cpX, cpY, endX, endY);
      ctx.stroke();
    }
  }

  // mãos sangrentas
  for (let i = 0; i < 3; i++) {
    const x = 100 + Math.random() * (s - 200);
    const y = 100 + Math.random() * (s - 200);
    const scale = 0.9 + Math.random() * 0.9;
    const rot = (Math.random() - 0.5) * 1.2;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
    ctx.fillStyle = `rgba(${55 + Math.random()*30|0}, 5, 5, 0.68)`;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 28, 0, 0, Math.PI * 2); ctx.fill();
    for (let f = 0; f < 4; f++) {
      const fx = -14 + f * 9;
      const flen = 22 + Math.random() * 10;
      ctx.beginPath(); ctx.ellipse(fx, -28, 5, flen/2, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(-24, -5, 6, 12, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // olhos pintados observando
  if (variant === 1) {
    for (let i = 0; i < 4; i++) paintEyes(ctx, 120 + Math.random() * 780, 330 + Math.random() * 280, 0.8 + Math.random() * 0.9);
  } else if (Math.random() < 0.4) {
    paintEyes(ctx, 200 + Math.random() * 600, 380 + Math.random() * 200, 1.1);
  }

  // frases
  const phrases = ['VÁ EMBORA', 'NÃO OLHE PARA TRÁS', 'ELE ESTÁ PERTO', 'CORRA', 'SAIA', 'NÃO É REAL', 'VOCÊ VAI MORRER', 'OLHE PARA MIM', 'ELE VÊ VOCÊ', 'NÃO HÁ SAÍDA', 'ELE OUVE'];
  const nPhr = variant === 2 ? 6 : 3;
  for (let i = 0; i < nPhr; i++) {
    const phrase = phrases[Math.floor(Math.random() * phrases.length)];
    const x = 80 + Math.random() * (s - 500);
    const y = 80 + Math.random() * (s - 200);
    const rot = (Math.random() - 0.5) * 0.7;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.font = `bold ${18 + Math.random() * 18}px serif`;
    ctx.fillStyle = `rgba(${55 + Math.random()*20|0}, ${Math.random()*15|0}, ${Math.random()*10|0}, ${0.65 + Math.random()*0.25})`;
    ctx.fillText(phrase, 0, 0);
    ctx.restore();
  }

  const vgrad = ctx.createRadialGradient(s/2, s/2, s*0.3, s/2, s/2, s*0.72);
  vgrad.addColorStop(0, 'rgba(0,0,0,0)');
  vgrad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, s, s);

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeFloorTex() {
  const size = 512;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2c2a25'; ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 36;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3;
  for (let i = 0; i <= size; i += 128) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }
  for (let i = 0; i < 14; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 20 + Math.random() * 70;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const red = Math.random() < 0.4;
    g.addColorStop(0, red ? 'rgba(60,0,0,.65)' : 'rgba(10,8,4,.55)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(70,0,0,.7)'; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    ctx.lineWidth = 6 + Math.random() * 10;
    const x = Math.random() * size, y = Math.random() * size;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + (Math.random()-.5)*200, y + (Math.random()-.5)*200, x + (Math.random()-.5)*260, y + (Math.random()-.5)*260);
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeBloodDecalTex() {

const wallTexes = [0, 1, 2].map(makeScaryWallTex);
const wallMats = wallTexes.map(t => new THREE.MeshStandardMaterial({ map: t, color: 0xffffff, roughness: 0.95 }));

/* ================= LABIRINTO ================= */
let grid = [];
const offset = -worldSize / 2 + CELL / 2;
const CENTER_CELL = Math.floor(CELLS / 2);
const goalWorldX = offset + CENTER_CELL * CELL;
const goalWorldZ = offset + CENTER_CELL * CELL;
const START_X = offset + CELL, START_Z = offset + CELL;
const inArena = (x, z, r = 2) => Math.abs(x - CENTER_CELL) <= r && Math.abs(z - CENTER_CELL) <= r;

function generateMaze(size) {
  const g = [];
  for (let y = 0; y < size; y++) { g[y] = []; for (let x = 0; x < size; x++) g[y][x] = true; }
  const stack = [];
  g[1][1] = false; stack.push([1, 1]);
  const dirs = [[0,-2],[2,0],[0,2],[-2,0]];
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const n = [];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx > 0 && ny > 0 && nx < size-1 && ny < size-1 && g[ny][nx]) n.push([nx, ny, cx + dx/2, cy + dy/2]);
    }
    if (!n.length) { stack.pop(); continue; }
    const [nx, ny, wx, wy] = n[Math.floor(rng() * n.length)];
    g[wy][wx] = false; g[ny][nx] = false; stack.push([nx, ny]);
  }
  let extra = Math.floor(size * size * 0.04);
  let guard = 500;
  while (extra > 0 && guard-- > 0) {
    const x = 1 + Math.floor(rng() * (size - 2));
    const y = 1 + Math.floor(rng() * (size - 2));
    if (g[y][x] && ((!g[y][x-1] && !g[y][x+1]) || (!g[y-1][x] && !g[y+1][x]))) { g[y][x] = false; extra--; }
  }
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const nx = CENTER_CELL + dx, nz = CENTER_CELL + dz;
    if (nx > 0 && nz > 0 && nx < size-1 && nz < size-1) g[nz][nx] = false;
  }
  return g;
}

function isWallCell(cx, cz) {
  if (cx < 0 || cz < 0 || cx >= CELLS || cz >= CELLS) return true;
  return grid[cz][cx];
}
function worldToCell(wx, wz) { return [Math.round((wx - offset) / CELL), Math.round((wz - offset) / CELL)]; }
const cellCenter = (cx, cz) => [offset + cx * CELL, offset + cz * CELL];

let propColliders = [];
function resolveCollision(pos, props = true) {
  const [cx, cz] = worldToCell(pos.x, pos.z);
  const half = CELL / 2;
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const gx = cx + dx, gz = cz + dz;
    if (!isWallCell(gx, gz)) continue;
    const wx = offset + gx * CELL, wz = offset + gz * CELL;
    const nx = clamp(pos.x, wx - half, wx + half), nz = clamp(pos.z, wz - half, wz + half);
    const ddx = pos.x - nx, ddz = pos.z - nz, d2 = ddx*ddx + ddz*ddz;
    if (d2 < PLAYER_R * PLAYER_R) {
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2), push = PLAYER_R - d;
        pos.x += ddx / d * push; pos.z += ddz / d * push;
      } else {
        const px = half - Math.abs(pos.x - wx), pz = half - Math.abs(pos.z - wz);
        if (px < pz) pos.x += Math.sign(pos.x - wx || 1) * (px + PLAYER_R);
        else pos.z += Math.sign(pos.z - wz || 1) * (pz + PLAYER_R);
      }
    }
  }
  if (props) for (const pc of propColliders) {
    const ddx = pos.x - pc.x, ddz = pos.z - pc.z, rr = PLAYER_R + pc.r;
    const d2 = ddx*ddx + ddz*ddz;
    if (d2 < rr * rr && d2 > 1e-8) {
      const d = Math.sqrt(d2), push = rr - d;
      pos.x += ddx / d * push; pos.z += ddz / d * push;
    }
  }
}

function hasLOS(ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, d = Math.hypot(dx, dz);
  const n = Math.max(1, Math.ceil(d / 1.0));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    const [cx, cz] = worldToCell(ax + dx * t, az + dz * t);
    if (isWallCell(cx, cz)) return false;
  }
  return true;
}

function bfsDist(sx, sz) {
  const d = new Int16Array(CELLS * CELLS).fill(-1);
  const q = [[sx, sz]]; d[sz * CELLS + sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, z] = q[i];
    for (const [dx, dz] of DIRS4) {
      const nx = x + dx, nz = z + dz;
      if (isWallCell(nx, nz) || d[nz * CELLS + nx] >= 0) continue;
      d[nz * CELLS + nx] = d[z * CELLS + x] + 1; q.push([nx, nz]);
    }
  }
  return d;
}
function findFarCell() {
  const d = bfsDist(1, 1);
  let best = [CELLS - 2, CELLS - 2], bd = -1;
  for (let z = 1; z < CELLS - 1; z++) for (let x = 1; x < CELLS - 1; x++) {
    if (isWallCell(x, z) || inArena(x, z, 2)) continue;
    const v = d[z * CELLS + x];
    if (v > bd) { bd = v; best = [x, z]; }
  }
  return best;
}
function nearestOpenCell(cx, cz) {
  if (!isWallCell(cx, cz)) return [cx, cz];
  for (let r = 1; r <= 4; r++) for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
    if (!isWallCell(cx + dx, cz + dz)) return [cx + dx, cz + dz];
  }
  return [1, 1];
}
function randomOpenNear(x, z, r) {
  const [cx, cz] = worldToCell(x, z);
  for (let i = 0; i < 30; i++) {
    const nx = cx + Math.round((Math.random() * 2 - 1) * r), nz = cz + Math.round((Math.random() * 2 - 1) * r);
    if (!isWallCell(nx, nz)) return [nx, nz];
  }
  return nearestOpenCell(cx, cz);
}

function findPath(startCell, goalCell) {
  const [sx, sz] = startCell, [gx, gz] = goalCell;
  if (sx === gx && sz === gz) return [];
  if (isWallCell(gx, gz)) return [];
  const key = (x, z) => z * CELLS + x;
  const open = [{ x: sx, z: sz, g: 0, f: 0, parent: null }];
  const openMap = new Map([[key(sx, sz), open[0]]]);
  const closed = new Set();
  const h = (x, z) => Math.abs(x - gx) + Math.abs(z - gz);
  while (open.length) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
    const cur = open.splice(bi, 1)[0];
    openMap.delete(key(cur.x, cur.z));
    if (cur.x === gx && cur.z === gz) {
      const path = [];
      let n = cur;
      while (n && n.parent) { path.push([n.x, n.z]); n = n.parent; }
      return path.reverse();
    }
    closed.add(key(cur.x, cur.z));
    for (const [dx, dz] of DIRS4) {
      const nx = cur.x + dx, nz = cur.z + dz;
      if (isWallCell(nx, nz)) continue;
      const k = key(nx, nz);
      if (closed.has(k)) continue;
      const g = cur.g + 1;
      const ex = openMap.get(k);
      if (ex && g >= ex.g) continue;
      const node = { x: nx, z: nz, g, f: g + h(nx, nz), parent: cur };
      if (ex) { ex.g = g; ex.f = node.f; ex.parent = cur; }
      else { open.push(node); openMap.set(k, node); }
    }
  }
  return [];
}

/* ================= MUNDO (paredes, luzes, props) ================= */
let worldGroup = null, lampMesh = null, lamps = [], hangers = [];
const lampTint = new THREE.Color(0xd8e0a8);
const tmpColor = new THREE.Color();
let blackoutOn = false;

function buildWorld() {
  if (worldGroup) { worldGroup.traverse(o => { if (o.isInstancedMesh) o.dispose(); }); scene.remove(worldGroup); }
  worldGroup = new THREE.Group(); scene.add(worldGroup);
  lamps = []; hangers = []; propColliders = [];
  const dummy = new THREE.Object3D();

  // paredes (3 variações de textura)
  const buckets = [[], [], []];
  for (let y = 0; y < CELLS; y++) for (let x = 0; x < CELLS; x++) if (grid[y][x]) buckets[Math.floor(Math.random() * 3)].push([x, y]);
  buckets.forEach((list, vi) => {
    if (!list.length) return;
    const m = new THREE.InstancedMesh(wallGeo, wallMats[vi], list.length);
    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
    list.forEach(([x, y], i) => { dummy.position.set(offset + x * CELL, WALL_H/2, offset + y * CELL); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
    m.instanceMatrix.needsUpdate = true;
    worldGroup.add(m);
  });

  const open = [], deadEnds = [];
  const nOpen = (x, y) => (!isWallCell(x+1,y)) + (!isWallCell(x-1,y)) + (!isWallCell(x,y+1)) + (!isWallCell(x,y-1));
  for (let y = 1; y < CELLS - 1; y++) for (let x = 1; x < CELLS - 1; x++) {
    if (isWallCell(x, y)) continue;
    open.push([x, y]);
    if (nOpen(x, y) === 1 && !inArena(x, y, 2) && Math.abs(x - 1) + Math.abs(y - 1) > 3) deadEnds.push([x, y]);
  }
  const nearStart = (x, y) => Math.abs(x - 1) + Math.abs(y - 1) <= 3;

  // lâmpadas de teto: poucas, muitas quebradas ou piscando
  const lampList = [];
  for (const [x, y] of open) {
    if (inArena(x, y, 2) && !(x === CENTER_CELL && y === CENTER_CELL)) { /* arena tem luz própria */ }
    if (inArena(x, y, 1)) continue;
    if (Math.random() < 0.36 || (x === 1 && y === 1)) {
      const r = Math.random();
      const type = (x === 1 && y === 1) ? 2 : (r < 0.30 ? 0 : (r < 0.62 ? 1 : 2));   // 0 morta, 1 piscando, 2 firme
      const [wx, wz] = cellCenter(x, y);
      lampList.push({ x: wx, z: wz, type, v: type === 0 ? 0 : 1, f: Math.random(), horiz: (!isWallCell(x+1,y) || !isWallCell(x-1,y)) });
    }
  }
  if (!lampList.length) lampList.push({ x: START_X, z: START_Z, type: 2, v: 1, f: 0, horiz: true });
  lamps = lampList;
  lampMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5, 0.05, 0.5), new THREE.MeshBasicMaterial({ color: 0xffffff }), lamps.length);
  lampMesh.frustumCulled = false;
  lamps.forEach((l, i) => {
    dummy.position.set(l.x, WALL_H - 0.03, l.z); dummy.rotation.set(0, l.horiz ? 0 : Math.PI/2, 0); dummy.updateMatrix();
    lampMesh.setMatrixAt(i, dummy.matrix);
    tmpColor.copy(lampTint).multiplyScalar(l.v); lampMesh.setColorAt(i, tmpColor);
  });
  lampMesh.instanceMatrix.needsUpdate = true;
  lampMesh.instanceColor.needsUpdate = true;
  worldGroup.add(lampMesh);

  // props: caixas e barris encostados nos cantos (com colisão)
  const crates = [], barrels = [];
  for (const [x, y] of open) {
    if (nearStart(x, y) || inArena(x, y, 2)) continue;
    if (Math.random() > 0.13) continue;
    const [wx, wz] = cellCenter(x, y);
    const sx = Math.random() < .5 ? -1 : 1, sz = Math.random() < .5 ? -1 : 1;
    const px = wx + sx * 1.35, pz = wz + sz * 1.35;
    if (Math.random() < 0.5) crates.push([px, pz, Math.random() * Math.PI]); else barrels.push([px, pz]);
    propColliders.push({ x: px, z: pz, r: 0.55 });
  }
  for (const [x, y] of deadEnds) {
    if (Math.random() > 0.8) continue;
    const [wx, wz] = cellCenter(x, y);
    const px = wx + 1.3, pz = wz - 1.3;
    crates.push([px, pz, Math.random() * Math.PI]); propColliders.push({ x: px, z: pz, r: 0.55 });
  }
  if (crates.length) {
    const m = new THREE.InstancedMesh(new THREE.BoxGeometry(0.95, 0.95, 0.95), new THREE.MeshStandardMaterial({ color: 0x2a1d12, roughness: 1 }), crates.length);
    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
    crates.forEach(([x, z, r], i) => { dummy.position.set(x, 0.475, z); dummy.rotation.set(0, r, 0); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
    worldGroup.add(m);
  }
  if (barrels.length) {
    const m = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.36, 0.36, 1.05, 10), new THREE.MeshStandardMaterial({ color: 0x1b2022, roughness: 0.8, metalness: 0.3 }), barrels.length);
    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
    barrels.forEach(([x, z], i) => { dummy.position.set(x, 0.525, z); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
    worldGroup.add(m);
  }

  // manchas de sangue no chão (mais nos becos sem saída)
  const decals = [];
  for (const [x, y] of open) {
    if (nearStart(x, y) || inArena(x, y, 1)) continue;
    if (Math.random() < 0.09) { const [wx, wz] = cellCenter(x, y); decals.push([wx + (Math.random()-.5)*2, wz + (Math.random()-.5)*2, 1.6 + Math.random() * 1.2]); }
  }
  for (const [x, y] of deadEnds) { const [wx, wz] = cellCenter(x, y); decals.push([wx, wz, 3.4], [wx + 0.8, wz + 0.5, 2.2]); }
  if (decals.length) {
    const m = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), decalMat, decals.length);
    m.receiveShadow = true; m.frustumCulled = false;
    decals.forEach(([x, z, s], i) => { dummy.position.set(x, 0.015, z); dummy.rotation.set(-Math.PI/2, 0, Math.random() * Math.PI * 2); dummy.scale.set(s, s, 1); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
    dummy.scale.set(1, 1, 1);
    worldGroup.add(m);
  }

  // coisas penduradas no teto (silhuetas balançando)
  const hangSpots = [];
  for (const [x, y] of deadEnds) hangSpots.push([x, y]);
  for (let i = 0; i < 9; i++) { const c = open[Math.floor(Math.random() * open.length)]; if (!nearStart(c[0], c[1]) && !inArena(c[0], c[1], 2)) hangSpots.push(c); }
  const chainMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.6, metalness: 0.6 });
  const sackMat = new THREE.MeshStandardMaterial({ color: 0x14110e, roughness: 1 });
  for (const [x, y] of hangSpots) {
    const [wx, wz] = cellCenter(x, y);
    const g = new THREE.Group();
    const len = 0.9 + Math.random() * 0.9;
    const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 5), chainMat);
    chain.position.y = -len / 2; g.add(chain);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.75, 3, 8), sackMat);
    body.position.y = -len - 0.45; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), sackMat);
    head.position.set(0, -len + 0.02, 0); head.castShadow = true; g.add(head);
    g.position.set(wx + (Math.random() - .5) * 1.8, WALL_H, wz + (Math.random() - .5) * 1.8);
    g.rotation.y = Math.random() * 6.28;
    worldGroup.add(g);
    hangers.push({ g, ph: Math.random() * 6.28, amp: 0.05 + Math.random() * 0.06 });
  }
}

function updateWorldFX(dt) {
  const t = performance.now() * 0.001;
  for (const h of hangers) { h.g.rotation.z = Math.sin(t * 0.9 + h.ph) * h.amp; h.g.rotation.x = Math.cos(t * 0.7 + h.ph) * h.amp * 0.7; }
  if (!lampMesh) return;
  for (let i = 0; i < lamps.length; i++) {
    const l = lamps[i];
    let v;
    if (blackoutOn) v = 0;
    else if (l.type === 0) v = Math.random() < 0.002 ? 0.5 : 0;
    else if (l.type === 1) {
      l.f -= dt;
      if (l.f <= 0) { l.v = Math.random() < 0.5 ? 0 : (0.4 + Math.random() * 0.6); l.f = 0.03 + Math.random() * (Math.random() < 0.2 ? 1.2 : 0.2); }
      v = l.v;
    } else { if (Math.random() < 0.003) l.v = 0.15; else l.v += (1 - l.v) * 0.25; v = l.v; }

  }

  const cand = lamps.filter(l => l.cur > 0.05).map(l => ({ l, d: (l.x - camera.position.x) ** 2 + (l.z - camera.position.z) ** 2 })).sort((a, b) => a.d - b.d);

  for (const cfg of eyeConfigs) for (const [ex, ey, ez] of cfg.pos) {
    const eye = new THREE.Mesh(cfg.geo, eyeMatR); eye.position.set(ex, ey, ez); headGroup.add(eye);
    const glow = new THREE.Mesh(glowGeo, glowMat); glow.position.set(ex, ey, ez); glow.scale.setScalar(0.1); headGroup.add(glow);
  }

  const armGeo = new THREE.CapsuleGeometry(0.07, 1.7, 4, 8);

    for (let i = 0; i < 4; i++) {
      const claw = new THREE.Mesh(clawGeo, darkerMat);

    a2.position.set(sx * 0.38, 2.05, 0.1); a2.rotation.z = sx * 0.45; a2.rotation.x = -0.35; a2.castShadow = true; g.add(a2);
  }
  const spikeGeo = new THREE.ConeGeometry(1, 1, 4);
  for (let i = 0; i < 8; i++) {

    g.add(tendril); tendrils.push(tendril);
  }
  g.userData.tendrils = tendrils; g.userData.arms = arms; g.userData.animTime = 0;
  return g;
}

function animateCreature(mesh, dt, aggressive) {
  mesh.userData.animTime = (mesh.userData.animTime || 0) + dt;
  const t = mesh.userData.animTime;
  const speed = aggressive ? 2.2 : 1.0;
  const hg = mesh.userData.headGroup;
  if (hg) { hg.position.y = 3.05 + Math.sin(t * speed * 1.5) * 0.04; hg.rotation.x = Math.sin(t * speed * 0.8) * 0.06; }
  const arms = mesh.userData.arms;
  if (arms) for (let i = 0; i < arms.length; i++) {
    const sway = Math.sin(t * speed * 1.7 + i * 1.3) * (aggressive ? 0.25 : 0.1);
    const sx = i === 0 ? -1 : 1;
    arms[i].rotation.z = sx * 0.15 + sway;
    arms[i].rotation.x = Math.cos(t * speed * 1.9 + i) * (aggressive ? 0.15 : 0.06);
  }
  const tendrils = mesh.userData.tendrils;
  if (tendrils) for (const tendril of tendrils) {
    const phase = tendril.userData.basePhase;
    tendril.rotation.x = Math.sin(t * speed * 1.4 + phase) * (aggressive ? 0.35 : 0.15);
    tendril.rotation.z = Math.cos(t * speed * 1.2 + phase) * (aggressive ? 0.35 : 0.15);
  }
}

function lookHead(mesh, tx, tz) {
  const hg = mesh.userData.headGroup; if (!hg) return;
  const want = faceAngle(tx - mesh.position.x, tz - mesh.position.z);
  hg.rotation.y = clamp(angNorm(want - mesh.rotation.y), -1.7, 1.7);
}

let audioCtx = null;

function ensureAudio() {
  try {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { console.warn('audio', e); }
}
['touchstart', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { passive: true }));

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  growlOsc = audioCtx.createOscillator();
  growlOsc.type = 'sawtooth'; growlOsc.frequency.value = 38;
  const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.6;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = 6;
  lfo.connect(lfoG).connect(growlOsc.frequency); lfo.start();
  growlFilter = audioCtx.createBiquadFilter();
  growlFilter.type = 'lowpass'; growlFilter.frequency.value = 180; growlFilter.Q.value = 5;
  growlGain = audioCtx.createGain(); growlGain.gain.value = 0;
  growlOsc.connect(growlFilter).connect(growlGain).connect(audioCtx.destination);
  growlOsc.start();

  const bs = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
  breathSrc = audioCtx.createBufferSource(); breathSrc.buffer = buf; breathSrc.loop = true;
  breathFilter = audioCtx.createBiquadFilter();
  breathFilter.type = 'bandpass'; breathFilter.frequency.value = 420; breathFilter.Q.value = 1.2;
  breathGain = audioCtx.createGain(); breathGain.gain.value = 0;
  breathSrc.connect(breathFilter).connect(breathGain).connect(audioCtx.destination);
  breathSrc.start();

  const wbuf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const wd = wbuf.getChannelData(0);
  for (let i = 0; i < bs; i++) wd[i] = (Math.random() * 2 - 1) * 0.6;
  const wsrc = audioCtx.createBufferSource(); wsrc.buffer = wbuf; wsrc.loop = true;
  const wFilter = audioCtx.createBiquadFilter();
  wFilter.type = 'bandpass'; wFilter.frequency.value = 1400; wFilter.Q.value = 8;
  whisperGain = audioCtx.createGain(); whisperGain.gain.value = 0;
  wsrc.connect(wFilter).connect(whisperGain).connect(audioCtx.destination);
  wsrc.start();

  // zumbido ambiente constante
  const d1 = audioCtx.createOscillator(), d2 = audioCtx.createOscillator(), dg = audioCtx.createGain(), df = audioCtx.createBiquadFilter();
  d1.type = 'sine'; d1.frequency.value = 50; d2.type = 'triangle'; d2.frequency.value = 50.9;
  df.type = 'lowpass'; df.frequency.value = 220; dg.gain.value = 0.045;
  d1.connect(df); d2.connect(df); df.connect(dg).connect(audioCtx.destination);

}

function silenceAudio() {

}

function pannerChain(node, pan) {
  if (audioCtx.createStereoPanner && pan) {
    const p = audioCtx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    return node.connect(p).connect(audioCtx.destination);

}
function panFor(x, z) {
  const dx = x - player.x, dz = z - player.z, d = Math.hypot(dx, dz) || 1;
  return ((dx / d) * Math.cos(player.yaw) + (dz / d) * -Math.sin(player.yaw));
}

const joyEl = $('joystick'), knobEl = $('joystickKnob');

let lookId = null, lookLast = { x: 0, y: 0 };

const LOOK_SENS = 0.0058;

function resetTouchState() {
  joyId = null; lookId = null; joyVec.x = joyVec.y = 0; sprintTouch = false;
  joyEl.style.display = 'none'; btnSprintEl.classList.remove('active');
}

function setupTouch() {
  if (!isTouch) return;
  const bs = btnSprintEl;
  const sOn = e => { e.preventDefault(); e.stopPropagation(); sprintTouch = true; bs.classList.add('active'); };
  const sOff = e => { e.preventDefault(); e.stopPropagation(); sprintTouch = false; bs.classList.remove('active'); };
  bs.addEventListener('touchstart', sOn, { passive: false });
  bs.addEventListener('touchend', sOff, { passive: false });
  bs.addEventListener('touchcancel', sOff, { passive: false });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth * 0.5 && joyId === null) {
        joyId = t.identifier; joyStart.x = t.clientX; joyStart.y = t.clientY; joyVec.x = joyVec.y = 0;
        joyEl.style.display = 'block';
        joyEl.style.left = (t.clientX - 65) + 'px'; joyEl.style.top = (t.clientY - 65) + 'px';
        knobEl.style.transform = 'translate(0,0)';
      } else if (t.clientX >= innerWidth * 0.5 && lookId === null) {
        lookId = t.identifier; lookLast.x = t.clientX; lookLast.y = t.clientY;
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) {
        const dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
        const len = Math.hypot(dx, dy), max = 52, cl = Math.min(len, max);
        const nx = len ? dx / len : 0, ny = len ? dy / len : 0;
        joyVec.x = nx * (cl / max); joyVec.y = ny * (cl / max);
        knobEl.style.transform = `translate(${nx * cl}px,${ny * cl}px)`;
      } else if (t.identifier === lookId) {
        player.yaw -= (t.clientX - lookLast.x) * LOOK_SENS;
        lookLast.x = t.clientX; lookLast.y = t.clientY;
      }
    }
  }, { passive: false });
  const end = e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) { joyId = null; joyVec.x = joyVec.y = 0; joyEl.style.display = 'none'; }
      if (t.identifier === lookId) lookId = null;

  canvas.addEventListener('touchend', end, { passive: false });
  canvas.addEventListener('touchcancel', end, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(g => document.addEventListener(g, e => e.preventDefault()));
}

/* ================= REDE (host-autoritativa) ================= */
let peer = null, isHost = false, roomCode = null, hostConn = null;
let lastHostSeen = 0, lastNetSend = 0;
const connections = new Map();

function genCode() {
  const c = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function leaveNetwork() {
  const hc = hostConn, p = peer, conns = [...connections.values()];
  hostConn = null; peer = null; isHost = false; roomCode = null; connections.clear();
  try { if (hc) hc.close(); } catch (e) {}
  for (const c of conns) { try { c.conn.close(); } catch (e) {} }
  try { if (p) p.destroy(); } catch (e) {}
}
function broadcast(obj) { for (const [, c] of connections) { try { if (c.conn.open) c.conn.send(obj); } catch (e) {} } }
function setNotice(msg) { $('hostErr').textContent = msg; $('overWait').textContent = msg; }

function tryCreateHost(attempts = 3) {
  const code = genCode();
  const p = new Peer(ID_PREFIX + code, PEER_OPTS);
  let opened = false;
  p.on('open', id => {
    opened = true; peer = p; isHost = true; roomCode = code;
    local.id = id; local.name = 'P1'; local.color = PLAYER_COLORS[0]; local.index = 0;
    $('roomCode').textContent = code.toUpperCase();
    $('hostErr').textContent = '';
    updateHostLobby();
    showPage('host');
  });
  p.on('error', err => {
    if (!opened) {
      try { p.destroy(); } catch (e) {}
      if (err.type === 'unavailable-id' && attempts > 1) setTimeout(() => tryCreateHost(attempts - 1), 250);
      else $('mainErr').textContent = 'Não foi possível criar a sala (' + err.type + ').';
    } else console.warn('peer error', err);
  });
  p.on('disconnected', () => { if (opened && peer === p && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
  p.on('connection', onIncoming);
}

function onIncoming(conn) {
  conn.on('open', () => {
    if (game.active) { conn.send({ type: 'busy' }); setTimeout(() => conn.close(), 600); return; }
    const maxP = parseInt($('hostMax').value) || 4;
    if (connections.size + 1 >= maxP) { conn.send({ type: 'full' }); setTimeout(() => conn.close(), 600); return; }
    const used = new Set([...connections.values()].map(c => c.index));
    let idx = 1; while (used.has(idx)) idx++;
    const info = { name: 'P' + (idx + 1), color: PLAYER_COLORS[idx], index: idx };
    connections.set(conn.peer, { conn, ...info, lastSeen: performance.now() });
    conn.send({ type: 'welcome', id: conn.peer, ...info });
    updateHostLobby(); broadcastLobby();
  });
  conn.on('data', d => handleClientData(conn.peer, d));
  conn.on('close', () => playerLeft(conn.peer));
  conn.on('error', () => playerLeft(conn.peer));
}

function lobbyNames() { return ['P1 · anfitrião', ...[...connections.values()].map(c => c.name)]; }
function broadcastLobby() { broadcast({ type: 'lobby', players: lobbyNames() }); }
function updateHostLobby() {
  let html = '<div>Você (P1)</div>';
  for (const [, c] of connections) html += `<div>${c.name}</div>`;
  $('hostLobby').innerHTML = html;
}

function tryJoin(code) {
  leaveNetwork();
  const p = new Peer(PEER_OPTS);
  peer = p; isHost = false;
  let done = false;
  const fail = msg => { if (done) return; done = true; clearTimeout(timer); if (peer === p) leaveNetwork(); else try { p.destroy(); } catch (e) {} $('joinErr').textContent = msg; showPage('join'); };
  const timer = setTimeout(() => fail('Tempo esgotado. Verifique o código.'), 15000);
  $('joinErr').textContent = 'Conectando...';
  p.on('open', id => {
    local.id = id;
    const conn = p.connect(ID_PREFIX + code.toLowerCase(), { reliable: true, serialization: 'json' });
    hostConn = conn;
    conn.on('open', () => {
      if (done) return; done = true; clearTimeout(timer);
      lastHostSeen = performance.now();
      $('joinErr').textContent = '';
      showPage('wait');
      $('waitInfo').textContent = 'Conectado. Aguardando início...';
    });
    conn.on('data', handleHostData);
    conn.on('close', () => { if (hostConn !== conn) return; onHostLost(); });
    conn.on('error', () => { if (!done) fail('Erro ao conectar.'); else if (hostConn === conn) onHostLost(); });
  });
  p.on('error', err => {
    if (err.type === 'peer-unavailable') fail('Sala não encontrada.');
    else if (!done) fail('Erro: ' + err.type);
  });
}

function onHostLost() {
  if (game.active) { endGame('disconnect', { msg: 'O anfitrião desconectou.' }, false); }
  else if (!game.over) { leaveNetwork(); $('mainErr').textContent = 'Conexão com a sala perdida.'; showPage('main'); }
  hostConn = null;
}

function handleClientData(peerId, data) {
  if (!data || !data.type) return;
  const c = connections.get(peerId); if (!c) return;
  c.lastSeen = performance.now();
  if (data.type === 'state' && game.active) {
    const p = game.players.get(peerId);
    if (p && !p.dead && isFinite(data.x) && isFinite(data.z)) { p.x = data.x; p.z = data.z; p.yaw = data.yaw || 0; }
    else if (p && p.dead && isFinite(data.x)) { p.x = data.x; p.z = data.z; p.yaw = data.yaw || 0; }
  }
}

function handleHostData(data) {
  if (!data || !data.type) return;
  lastHostSeen = performance.now();
  switch (data.type) {
    case 'full': leaveNetwork(); $('joinErr').textContent = 'Sala cheia.'; showPage('join'); break;
    case 'busy': leaveNetwork(); $('joinErr').textContent = 'Partida em andamento.'; showPage('join'); break;
    case 'welcome':
      local.id = data.id; local.name = data.name; local.color = data.color; local.index = data.index;
      $('waitInfo').textContent = 'Conectado como ' + data.name + '. Aguardando...';
      break;
    case 'lobby': $('clientLobby').innerHTML = data.players.map(n => '<div>' + n + '</div>').join(''); break;
    case 'start': startGame({ mode: data.mode, seed: data.seed, creatureId: data.creatureId, roster: data.roster }); break;
    case 'state':
      if (!game.active) break;
      for (const [id, s] of Object.entries(data.players)) {
        if (id === local.id) { if (s.dead && player.alive) onCaught(id); continue; }
        const p = game.players.get(id); if (!p) continue;
        p.x = s.x; p.z = s.z; p.yaw = s.yaw; if (s.dead) p.dead = true;
      }
      if (data.ai) {
        const a = game.aiCreature;
        a.x = data.ai.x; a.z = data.ai.z; a.yaw = data.ai.yaw; a.fz = !!data.ai.fz;
        if (data.ai.st !== a.st) { a.st = data.ai.st; onAiStChange(a.st); }
      }
      break;
    case 'caught': onCaught(data.id); break;
    case 'left': game.players.delete(data.id); break;
    case 'end': endGame(data.reason, { msg: data.msg }, false); break;
    case 'win': winGame(data.winnerId, data.winnerName, false); break;
  }
}

function playerLeft(id) {
  if (!connections.has(id)) return;
  const c = connections.get(id);
  connections.delete(id);
  try { c.conn.close(); } catch (e) {}
  if (!game.active) { updateHostLobby(); broadcastLobby(); return; }
  game.players.delete(id);
  broadcast({ type: 'left', id });
  if (game.mode === 'hunter' && id === game.creatureId) { endGame('disconnect', { msg: 'O monstro desconectou.' }, true); return; }
  const humans = humanEntries();
  if (!humans.length) { endGame('disconnect', { msg: 'Todos os jogadores saíram.' }, true); return; }
  checkAllDead();
}

function humanEntries() {
  return [...game.players.entries()].filter(([id]) => !(game.mode === 'hunter' && id === game.creatureId));
}
function catchPlayer(id) {
  const p = game.players.get(id);
  if (!p || p.dead || game.over) return;
  p.dead = true;
  broadcast({ type: 'caught', id });
  onCaught(id);
  checkAllDead();
}
function checkAllDead() {
  const humans = humanEntries();
  if (humans.length && humans.every(([, p]) => p.dead)) endGame('allcaught', {}, true);
}
function onCaught(id) {
  const p = game.players.get(id); if (p) p.dead = true;
  if (id === local.id) {
    if (!player.alive) return;
    player.alive = false;
    jumpscare();
    hudTitle.textContent = 'Você foi pego · observando';
    distEl.textContent = '';
  } else playDistantScream();
}

function clientSendState(dt) {
  if (isHost || !hostConn || !hostConn.open) return;
  lastNetSend += dt;
  if (lastNetSend > 1 / NET_HZ) {
    lastNetSend = 0;
    try { hostConn.send({ type: 'state', x: player.x, z: player.z, yaw: player.yaw }); } catch (e) {}
  }
  if (performance.now() - lastHostSeen > NET_TIMEOUT) onHostLost();
}

function hostUpdateAndBroadcast(dt) {
  if (!isHost) return;
  const now = performance.now();
  for (const [id, c] of [...connections]) if (now - c.lastSeen > NET_TIMEOUT) playerLeft(id);
  if (!game.active) return;
  if (game.mode === 'hunter' && game.creatureId) {
    const cp = game.players.get(game.creatureId);
    if (cp) for (const [id, p] of game.players) {
      if (id === game.creatureId || p.dead) continue;
      const d = Math.hypot(p.x - cp.x, p.z - cp.z);
      if (d < CATCH_DIST && (d < 1.8 || hasLOS(cp.x, cp.z, p.x, p.z))) { catchPlayer(id); if (!game.active) return; }
    }
  }
  lastNetSend += dt;
  if (lastNetSend > 1 / NET_HZ) {
    lastNetSend = 0;
    const players = {};
    for (const [id, p] of game.players) players[id] = { x: +p.x.toFixed(2), z: +p.z.toFixed(2), yaw: +p.yaw.toFixed(3), dead: !!p.dead };
    const a = game.aiCreature;
    const ai = game.mode === 'flee' ? { x: +a.x.toFixed(2), z: +a.z.toFixed(2), yaw: +a.yaw.toFixed(3), st: a.st, fz: a.fz } : null;
    broadcast({ type: 'state', players, ai });
  }
}

function hostStartMatch() {

  if (mode === 'hunter' && connections.size === 0) { setNotice('Modo monstro precisa de 2+ jogadores.'); return; }

  startGame({ mode, seed, creatureId, roster });
}

  for (const [id, p] of game.players) {
    if (p.dead || (game.mode === 'hunter' && id === game.creatureId)) continue;
    if (Math.hypot(p.x - goalWorldX, p.z - goalWorldZ) < GOAL_RADIUS) { winGame(id, p.name, true); return; }
  }
}

/* ================= IA DA CRIATURA ================= */
function onAiStChange(st) {
  if (!audioCtx) return;
  if (st === 3) { playRoar(0.14); vib(60); }
  else if (st === 4) { playRoar(0.32); vib([120, 40, 120]); }
}

function tryTeleport(alive, c) {
  for (let i = 0; i < 14; i++) {
    const [, tp] = alive[Math.floor(Math.random() * alive.length)];
    const [cx, cz] = randomOpenNear(tp.x, tp.z, 6);
    const [wx, wz] = cellCenter(cx, cz);
    let ok = true, minD = Infinity;
    for (const [, p] of alive) {
      const d = Math.hypot(p.x - wx, p.z - wz); minD = Math.min(minD, d);
      if (d < 30 && hasLOS(p.x, p.z, wx, wz)) { ok = false; break; }
    }
    if (!ok || minD < 10 || minD > 20) continue;
    c.x = wx; c.z = wz; aiBrain.path = []; aiBrain.pathT = 0;
    aiBrain.goal = { x: tp.x, z: tp.z }; aiBrain.state = 'search';
    aiVis.x = c.x; aiVis.z = c.z;
    return;
  }
}

function updateAICreature(dt) {
  if (game.mode !== 'flee' && game.mode !== 'solo') return;
  const c = game.aiCreature, b = aiBrain;
  b.time += dt;
  const rage = Math.min(1, b.time / 360);           // fica mais agressiva com o tempo
  const alive = [];
  for (const [id, p] of game.players) if (!p.dead) alive.push([id, p]);
  if (!alive.length) return;

  for (const [, p] of alive) {                       // estima velocidade (ruído de corrida)
    if (p._lx !== undefined) p.spd = p.spd * 0.9 + (Math.hypot(p.x - p._lx, p.z - p._lz) / Math.max(dt, 0.001)) * 0.1;
    p._lx = p.x; p._lz = p.z;
  }

  let nearest = null, nid = null, nd = Infinity, seen = null, sd = Infinity;
  for (const [id, p] of alive) {
    const d = Math.hypot(p.x - c.x, p.z - c.z);
    if (d < nd) { nd = d; nearest = p; nid = id; }
    if (d < 26 && d < sd && hasLOS(c.x, c.z, p.x, p.z)) { sd = d; seen = p; }
  }

  // congela quando é observada (com linha de visão real)
  let frozen = false;
  if (b.lunge <= 0) for (const [, p] of alive) {
    const dx = c.x - p.x, dz = c.z - p.z, d = Math.hypot(dx, dz);
    if (d < 1.5 || d > 24) continue;
    const fx = -Math.sin(p.yaw), fz = -Math.cos(p.yaw);
    if ((dx / d) * fx + (dz / d) * fz > 0.72 && hasLOS(p.x, p.z, c.x, c.z)) { frozen = true; break; }
  }

  // percepção
  if (seen) {
    b.goal = { x: seen.x, z: seen.z };
    if (b.state !== 'hunt') { b.state = 'hunt'; b.pathT = 0; }
  } else {
    for (const [, p] of alive) {
      const d = Math.hypot(p.x - c.x, p.z - c.z);
      if (d < 9 || (p.spd > 6.3 && d < 20)) { b.goal = { x: p.x, z: p.z }; if (b.state === 'wander') { b.state = 'search'; b.pathT = 0; } }
    }
    b.scentT -= dt;
    if (b.scentT <= 0) {
      const [, t] = alive[Math.floor(Math.random() * alive.length)];
      b.goal = { x: t.x + (Math.random() - .5) * 8, z: t.z + (Math.random() - .5) * 8 };
      b.state = 'search'; b.pathT = 0; b.scentT = 16 + Math.random() * 12 - rage * 8;
    }
    if (b.state === 'hunt') b.state = 'search';
  }

  // chegou ao destino → vasculha
  if (b.goal && b.state !== 'hunt' && Math.hypot(b.goal.x - c.x, b.goal.z - c.z) < 1.6) {
    b.state = 'wander'; b.goal = null; b.path = []; b.wanderPause = 1 + Math.random() * 2.5;
  }
  if (!b.goal && b.state !== 'hunt') {
    b.state = 'wander';
    if (b.wanderPause > 0) b.wanderPause -= dt;
    else {
      const [, t] = alive[Math.floor(Math.random() * alive.length)];
      const [cx, cz] = randomOpenNear(t.x, t.z, 5);
      const [wx, wz] = cellCenter(cx, cz);
      b.goal = { x: wx, z: wz }; b.pathT = 0;
    }
  }

  // velocidade
  let sp = AI_SPEED;
  if (b.state === 'hunt') sp *= 1.0 + 0.28 * rage; else if (b.state === 'search') sp *= 0.88 + 0.2 * rage; else sp *= 0.62;
  if (b.state === 'hunt' && nd < 7) sp *= 1.35;
  let mult = 1;
  if (b.cd > 0) b.cd -= dt;
  if (b.stare > 0) { mult = 0; b.stare -= dt; if (b.stare <= 0) b.lunge = 1.1; }
  else if (b.lunge > 0) { mult = 2.0; b.lunge -= dt; }
  else if (frozen) mult = nd < 7 ? 0.3 : 0.08;
  if (b.state === 'hunt' && !frozen && b.stare <= 0 && b.lunge <= 0 && b.cd <= 0 && sd < 16 && sd > 5 && Math.random() < 0.45 * dt) {
    b.stare = 0.8 + Math.random() * 0.9; b.cd = 9 + Math.random() * 7;
  }

  // teleporte fora de vista
  if (!frozen && b.stare <= 0 && b.lunge <= 0) {
    b.teleT -= dt;
    if (b.teleT <= 0) { b.teleT = 22 + Math.random() * 20; if (b.state !== 'hunt' || nd > 14) tryTeleport(alive, c); }
  }

  // caminho
  b.pathT -= dt;
  if (b.goal && b.pathT <= 0) {
    const cc = worldToCell(c.x, c.z);
    const gc = nearestOpenCell(...worldToCell(b.goal.x, b.goal.z));
    b.path = findPath(nearestOpenCell(cc[0], cc[1]), gc);
    b.pathT = b.state === 'hunt' ? 0.3 : 0.8;
  }
  let moving = false;
  if (b.goal && mult > 0.01) {
    let tx, tz;
    if (b.path.length) { tx = offset + b.path[0][0] * CELL; tz = offset + b.path[0][1] * CELL; } else { tx = b.goal.x; tz = b.goal.z; }
    const dx = tx - c.x, dz = tz - c.z, d = Math.hypot(dx, dz);
    if (b.path.length && d < 0.25) b.path.shift();
    else if (d > 0.05) {
      const step = Math.min(d, sp * mult * dt);
      c.x += dx / d * step; c.z += dz / d * step; b.dirX = dx / d; b.dirZ = dz / d; moving = true;
    }
    resolveCollision(c, false);
  }

  // captura
  if (nearest && nd < CATCH_DIST && (nd < 1.8 || hasLOS(c.x, c.z, nearest.x, nearest.z))) { catchPlayer(nid); if (!game.active) return; }

  // orientação
  let desired = c.yaw;
  if ((b.stare > 0 || b.state === 'hunt' || b.lunge > 0) && nearest) desired = faceAngle(nearest.x - c.x, nearest.z - c.z);
  else if (moving) desired = faceAngle(b.dirX, b.dirZ);
  c.yaw = lerpAngle(c.yaw, desired, Math.min(1, dt * (b.lunge > 0 ? 12 : 5)));
  const st = b.stare > 0 ? 3 : b.lunge > 0 ? 4 : b.state === 'hunt' ? 2 : b.state === 'search' ? 1 : 0;
  if (st !== c.st) { c.st = st; onAiStChange(st); }
  c.fz = frozen;
}

function updateAIVisual(dt) {
  if (!aiCreatureMesh.visible) return;
  const c = game.aiCreature;
  const authority = isHost || game.mode === 'solo';
  let k = authority ? 1 : Math.min(1, dt * 12);
  if (!authority && Math.hypot(c.x - aiVis.x, c.z - aiVis.z) > 8) k = 1;
  aiVis.x += (c.x - aiVis.x) * k; aiVis.z += (c.z - aiVis.z) * k; aiVis.yaw = lerpAngle(aiVis.yaw, c.yaw, k);
  aiCreatureMesh.position.set(aiVis.x, 0, aiVis.z);
  aiCreatureMesh.rotation.y = aiVis.yaw;
  lookHead(aiCreatureMesh, player.x, player.z);
  if (!c.fz) animateCreature(aiCreatureMesh, dt, Math.hypot(aiVis.x - player.x, aiVis.z - player.z) < 10 || c.st >= 2);
}

/* ================= JOGADOR LOCAL ================= */
let bobPhase = 0, shakeAmt = 0;

function updateLocalPlayer(dt) {
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (keys['KeyQ']) player.yaw += 1.9 * dt;
  if (keys['KeyE']) player.yaw -= 1.9 * dt;
  if (joyActive()) { mx += joyVec.x; mz += joyVec.y; }
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }

  const amCreature = game.creatureId === local.id;
  let speed = amCreature ? CREATURE_PLAYER_SPEED : BASE_SPEED;
  const wantsSprint = (keys['ShiftLeft'] || keys['ShiftRight'] || sprintTouch) && !amCreature;
  let sprinting = false;
  if (wantsSprint && player.stamina > STAMINA_MIN && len > 0.1) {
    sprinting = true; speed *= SPRINT_MULT;
    player.stamina = Math.max(0, player.stamina - STAMINA_DRAIN * dt);
  } else player.stamina = Math.min(STAMINA_MAX, player.stamina + STAMINA_REGEN * dt);
  player.sprinting = sprinting;

  const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
  const rightX = Math.cos(player.yaw), rightZ = -Math.sin(player.yaw);
  player.x += (mx * rightX + (-mz) * fwdX) * speed * dt;
  player.z += (mx * rightZ + (-mz) * fwdZ) * speed * dt;
  resolveCollision(player);

  const moving = len > 0.1;
  if (moving) bobPhase += dt * (sprinting ? 14 : 9);
  const bob = Math.sin(bobPhase) * (sprinting ? 0.06 : 0.035);

  let shakeX = 0, shakeZ = 0;
  if (shakeAmt > 0.01) { shakeX = (Math.random() - 0.5) * shakeAmt; shakeZ = (Math.random() - 0.5) * shakeAmt; shakeAmt *= 0.9; }

  const eyeH = amCreature ? CREATURE_EYE_H : EYE_H;
  camera.position.set(player.x + shakeX, eyeH + bob, player.z + shakeZ);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = 0;
  camera.rotation.z = Math.sin(bobPhase * 0.5) * (sprinting ? 0.012 : 0.004);

  if (amCreature) { flashlight.color.setHex(0xff2020); flashlight.distance = 18; }
  else { flashlight.color.setHex(0xffffff); flashlight.distance = 26; }
  flashlight.position.copy(camera.position);
  flashlight.target.position.set(camera.position.x - Math.sin(player.yaw), camera.position.y - 0.15, camera.position.z - Math.cos(player.yaw));
  flashlight.target.updateMatrixWorld();

  staminaFill.style.width = (player.stamina / STAMINA_MAX * 100) + '%';
  staminaFill.style.background = player.stamina < STAMINA_MIN ? 'rgba(255,80,80,.7)' : 'rgba(255,255,255,.5)';
}

function syncLocal() {
  const me = game.players.get(local.id);
  if (me) { me.x = player.x; me.z = player.z; me.yaw = player.yaw; }
}

function updateRemotePlayers(dt) {
  const lerp = Math.min(1, dt * 14);
  for (const [id, p] of game.players) {
    if (id === local.id) continue;
    const isC = game.mode === 'hunter' && game.creatureId === id;
    let entry = remoteMeshes.get(id);
    if (!entry || entry.isCreature !== isC) {
      if (entry) scene.remove(entry.mesh);
      const mesh = isC ? makeCreatureMesh() : makeHumanMesh(p.color);
      scene.add(mesh);
      entry = { mesh, isCreature: isC, x: p.x, z: p.z, yaw: p.yaw };
      remoteMeshes.set(id, entry);
    }
    entry.x += (p.x - entry.x) * lerp;
    entry.z += (p.z - entry.z) * lerp;
    entry.yaw = lerpAngle(entry.yaw, p.yaw, lerp);
    entry.mesh.visible = !p.dead;
    entry.mesh.position.set(entry.x, 0, entry.z);
    entry.mesh.rotation.y = entry.yaw;
    if (isC) {
      lookHead(entry.mesh, player.x, player.z);
      animateCreature(entry.mesh, dt, Math.hypot(entry.x - player.x, entry.z - player.z) < 10);
    }
  }
  for (const [id, entry] of [...remoteMeshes]) {
    if (!game.players.has(id) || id === local.id) { scene.remove(entry.mesh); remoteMeshes.delete(id); }
  }
}

/* ================= TERROR / EFEITOS ================= */
function threatPos() {
  const amC = game.creatureId === local.id;
  if (game.mode === 'hunter') {
    if (amC) {
      let best = null, nd = Infinity;
      for (const [id, p] of game.players) {
        if (id === local.id || p.dead) continue;
        const d = (p.x - player.x) ** 2 + (p.z - player.z) ** 2;
        if (d < nd) { nd = d; best = p; }
      }
      return best;
    }
    return game.players.get(game.creatureId) || null;
  }
  return game.aiCreature;
}

function spawnHallucination() {
  for (let i = 0; i < 24; i++) {
    const d = 7 + Math.random() * 9;
    const a = player.yaw + (Math.random() - 0.5) * 1.2;
    const x = player.x - Math.sin(a) * d, z = player.z - Math.cos(a) * d;
    const [cx, cz] = worldToCell(x, z);
    if (isWallCell(cx, cz) || !hasLOS(player.x, player.z, x, z)) continue;
    const mesh = makeCreatureMesh();
    mesh.position.set(x, 0, z);
    mesh.rotation.y = faceAngle(player.x - x, player.z - z);
    mesh.traverse(c => {
      if (c.material) {
        c.material = c.material.clone(); c.material.transparent = true; c.material.opacity = 0.85;
        if (c.material.color) { const hex = c.material.color.getHex(); if (hex === 0xff0000) c.material.color.setHex(0xffffff); }
      }
    });
    scene.add(mesh);
    hallucinations.push({ mesh, life: 1.0 });
    return;
  }
}

function updateHorror(dt) {
  const isCreature = game.creatureId === local.id;
  const quiet = isCreature || !player.alive;
  const tp = threatPos();
  const creatureDist = tp ? Math.hypot(tp.x - player.x, tp.z - player.z) : 999;
  const prox = Math.max(0, 1 - creatureDist / 25);
  const despair = 1 - (player.stamina / STAMINA_MAX);

  const staticIntensity = quiet ? 0 : Math.min(0.55, prox * prox * 0.45 + despair * 0.18);
  staticEl.style.opacity = staticIntensity;
  if (staticIntensity > 0.01) {
    noisePosX = (noisePosX + dt * 400) % 512; noisePosY = (noisePosY + dt * 300) % 512;
    staticEl.style.backgroundPosition = `${noisePosX}px ${noisePosY}px`;
  }
  bloodEl.style.opacity = quiet ? 0 : Math.max(0, (prox - 0.55) * 2.2);
  dangerEl.style.opacity = !quiet && prox > 0.35 ? (prox - 0.35) * 1.5 : 0;
  scene.fog.density = 0.062 + (quiet ? 0 : prox * 0.03);

  // lanterna + apagões
  const baseI = isCreature ? 8 : (player.alive ? 22 : 4);
  if (!quiet) {
    horror.blackoutTimer -= dt;
    if (horror.blackoutTimer <= 0) {
      horror.blackoutTimer = 40 + Math.random() * 40;
      horror.blackout = 1.4 + Math.random() * 2.2; playBlackout(); vib(80);
    }
  }
  if (horror.blackout > 0) { horror.blackout -= dt; flashlight.intensity = 0; blackoutOn = true; }
  else {
    blackoutOn = false;
    if (creatureDist < 12 && !quiet) flashlight.intensity = baseI * (0.5 + Math.random() * 0.7);
    else if (Math.random() < 0.025) flashlight.intensity = baseI * 0.25;
    else flashlight.intensity = flashlight.intensity * 0.65 + baseI * 0.35;
  }

  const pulse = Math.sin(performance.now() * 0.008) * (prox * 3 + despair * 1.5);
  const targetFov = horror.baseFov + prox * 8 + pulse;
  camera.fov += (targetFov - camera.fov) * 0.12;
  camera.updateProjectionMatrix();

  // rosto subliminar
  horror.faceTimer -= dt;
  if (horror.faceTimer <= 0 && !quiet && creatureDist < 22) {
    faceEl.style.display = 'flex';
    requestAnimationFrame(() => faceEl.style.opacity = 0.92);
    horror.faceShowTime = 0.14;
    horror.faceTimer = 18 + Math.random() * 30;
    vib(40);
  }
  if (horror.faceShowTime > 0) {
    horror.faceShowTime -= dt;
    if (horror.faceShowTime <= 0) { faceEl.style.opacity = 0; setTimeout(() => { if (horror.faceShowTime <= 0) faceEl.style.display = 'none'; }, 120); }
  }

  // alucinações visíveis à frente
  horror.hallucTimer -= dt;
  if (horror.hallucTimer <= 0 && !quiet && game.mode !== 'hunter') { spawnHallucination(); horror.hallucTimer = 14 + Math.random() * 26; }
  for (let i = hallucinations.length - 1; i >= 0; i--) {
    const h = hallucinations[i];
    h.life -= dt * 0.25;
    const dx = h.mesh.position.x - player.x, dz = h.mesh.position.z - player.z, d = Math.hypot(dx, dz);
    const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
    const dot = d > 0.1 ? (dx / d) * fwdX + (dz / d) * fwdZ : 0;
    if (dot > 0.5 && d < 20) h.life -= dt * 0.9;
    if (d < 3.5) h.life -= dt * 8;
    h.mesh.traverse(c => { if (c.material && c.material.transparent) c.material.opacity = Math.max(0, Math.min(0.85, h.life * 0.85)); });
    animateCreature(h.mesh, dt, false);
    lookHead(h.mesh, player.x, player.z);
    if (h.life <= 0) { scene.remove(h.mesh); hallucinations.splice(i, 1); }
  }

  // objetivo
  if (goalMesh && goalMesh.visible && goalMesh.userData.light) {
    const t = performance.now() * 0.002;
    goalMesh.userData.light.intensity = 12 + Math.sin(t) * 5;
    goalMesh.userData.floorGlow.material.opacity = 0.45 + Math.sin(t * 1.5) * 0.15;
    goalMesh.userData.ring.material.opacity = 0.75 + Math.sin(t * 2) * 0.15;
  }
  const goalDist = Math.hypot(player.x - goalWorldX, player.z - goalWorldZ);
  goalHintEl.textContent = goalDist < 12 ? `◎ ${goalDist.toFixed(0)}m` : '';

  // sons de ambiente
  if (audioCtx) {
    horror.footstepTimer -= dt;
    if (horror.footstepTimer <= 0 && tp && creatureDist < 18 && creatureDist > 2) {
      playFootstep(0.12 + (1 - creatureDist / 18) * 0.25, panFor(tp.x, tp.z));
      horror.footstepTimer = 0.45 + Math.random() * 0.35 + (creatureDist / 18) * 0.5;
    }
    horror.slamTimer -= dt;
    if (horror.slamTimer <= 0) { playDoorSlam(); horror.slamTimer = 14 + Math.random() * 26; }
    horror.screamTimer -= dt;
    if (horror.screamTimer <= 0) { playDistantScream(); horror.screamTimer = 18 + Math.random() * 40; }
    horror.creakTimer -= dt;
    if (horror.creakTimer <= 0) { playCreak(); horror.creakTimer = 9 + Math.random() * 20; }
    if (!quiet) {
      horror.phantomTimer -= dt;
      if (horror.phantomTimer <= 0) { horror.phantom = 7; horror.phantomT = 0; horror.phantomTimer = 45 + Math.random() * 50; }
    }
    if (horror.phantom > 0) {            // passos atrás de você que somem quando você olha
      horror.phantomT -= dt;
      if (horror.phantomT <= 0) { playFootstep(0.08 + (7 - horror.phantom) * 0.035, 0); horror.phantom--; horror.phantomT = 0.5 - (7 - horror.phantom) * 0.025; }
    }
    if (despair > 0.3 && breathGain) breathGain.gain.setTargetAtTime(0.08 + despair * 0.28, audioCtx.currentTime, 0.3);
  }
}

function updateScaryAudioAndFX(dt) {
  const tp = threatPos();
  const dist = tp ? Math.hypot(tp.x - player.x, tp.z - player.z) : 999;
  const prox = Math.max(0, 1 - dist / 35);
  const quiet = !player.alive;

  if (growlGain && audioCtx) {
    growlGain.gain.setTargetAtTime(quiet ? 0 : 0.02 + prox * prox * 0.65, audioCtx.currentTime, 0.15);
    growlFilter.frequency.setTargetAtTime(160 + prox * 800, audioCtx.currentTime, 0.2);
  }
  if (breathGain && audioCtx) {
    const b = prox > 0.5 ? (prox - 0.5) * 1.4 : 0;
    breathGain.gain.setTargetAtTime(quiet ? 0 : Math.max(b, player.stamina < 20 ? 0.12 : 0), audioCtx.currentTime, 0.3);
  }
  if (whisperGain && audioCtx) whisperGain.gain.setTargetAtTime(!quiet && prox > 0.28 ? (prox - 0.28) * 0.18 : 0, audioCtx.currentTime, 0.4);

  if (dist < 14 && !quiet) {
    heartbeatTimer -= dt;
    if (heartbeatTimer <= 0) {
      playHeartbeat(0.1 + (1 - dist / 14) * 0.32);
      if (dist < 8) vib(30);
      heartbeatTimer = 0.28 + (dist / 14) * 0.7;
    }
  }
  if (dist < 4 && !quiet) shakeAmt = Math.min(0.18, (4 - dist) * 0.05);
  if (player.alive) distEl.textContent = dist < 20 ? `⚠ ${dist.toFixed(1)}m` : '';
}

/* ================= LOOP ================= */
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (game.active) {
    updateLocalPlayer(dt);
    syncLocal();
    const authority = isHost || game.mode === 'solo';
    if (authority) {
      updateAICreature(dt);
      if (game.active) checkWinCondition();
      if (game.active) hostUpdateAndBroadcast(dt);
    } else clientSendState(dt);
    if (game.active) {
      updateAIVisual(dt);
      updateRemotePlayers(dt);
      updateScaryAudioAndFX(dt);
      updateHorror(dt);
      updateWorldFX(dt);
    }
  } else if (game.over === false && worldGroup && $('menu').style.display !== 'none') {
    // fundo do menu: nada a atualizar
  }
  renderer.render(scene, camera);
}
animate();

});
$('btnJoin').addEventListener('click', () => { $('joinErr').textContent = ''; showPage('join'); });
$('btnBackHost').addEventListener('click', () => { leaveNetwork(); showPage('main'); });
$('btnBackJoin').addEventListener('click', () => { leaveNetwork(); $('joinErr').textContent = ''; showPage('main'); });
$('btnJoinGo').addEventListener('click', () => {
  const code = $('joinCode').value.trim();
  if (code.length < 4) { $('joinErr').textContent = 'Código inválido.'; return; }
  if (typeof Peer === 'undefined') { $('joinErr').textContent = 'PeerJS não carregou.'; return; }
  ensureAudio(); enterImmersive();
  tryJoin(code);
});
$('hostMax').addEventListener('change', () => { broadcastLobby(); });
$('btnStartRoom').addEventListener('click', hostStartMatch);
$('btnLeaveWait').addEventListener('click', () => { leaveNetwork(); showPage('main'); });
$('btnRestart').addEventListener('click', () => {
  if (game.mode === 'solo') { startSolo(); return; }
  hostStartMatch();
});
$('btnQuit').addEventListener('click', quitToMenu);

setupTouch();
</script>
</body>
</html>
